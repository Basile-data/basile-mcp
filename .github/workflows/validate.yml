name: Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schemas:
    name: server.json et glama.json
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Installer les dépendances (versions figées par package-lock.json)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Valider server.json et glama.json contre leurs schémas officiels, vérifier les icônes
        run: node scripts/validate-server-json.mjs --check-icons

  docs:
    name: docs/TOOLS.md et fichiers JSON
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: docs/TOOLS.md et le résumé des outils du README correspondent à tools.json
        run: node scripts/generate-tools-md.mjs --check

      - name: Chaque fichier JSON du dépôt se lit
        run: |
          git ls-files -z '*.json' | xargs -0 -n1 node -e '
            const fichier = process.argv[1]
            JSON.parse(require("node:fs").readFileSync(fichier, "utf8"))
            console.log("ok", fichier)
          '
